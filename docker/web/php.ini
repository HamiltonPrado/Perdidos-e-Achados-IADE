; Definições do PHP para o contentor web.
; As fotos chegam já convertidas em JPEG pequenos, mas o backend aceita até 2 MB por foto.
upload_max_filesize = 4M
post_max_size = 8M

; Os erros vão para o log do contentor (docker compose logs web), nunca para a resposta.
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2

date.timezone = Europe/Lisbon
