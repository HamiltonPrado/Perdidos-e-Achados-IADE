# nginx: porta de entrada à frente do contentor «web».
# `resolve` volta a procurar o IP do web se ele reiniciar; os POST nunca são repetidos.

resolver 127.0.0.11 valid=10s ipv6=off;

upstream web {
    zone web 64k;
    server web:80 resolve max_fails=2 fail_timeout=10s;
}

# Controlo dos contentores para o laboratório da API (só desenvolvimento, ver docker-compose.yml).
upstream controlo {
    zone controlo 64k;
    server controlo:8000 resolve;
}

server {
    listen 80;

    # Vai direto ao contentor «controlo», sem passar pelo web: funciona mesmo com o web em baixo.
    location /controlo/ {
        proxy_pass http://controlo/;
        proxy_set_header Host $host;
        proxy_read_timeout 40s;
    }

    # As fotos chegam convertidas em JPEG pequenos; o backend aceita até 2 MB por foto.
    client_max_body_size 8m;

    # Para o healthcheck do próprio contentor nginx.
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        proxy_pass http://web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
        # Só falhas da própria réplica (não liga, não responde, 502/504) contam para a tirar
        # da rotação. Um 503 é a API a avisar que a BASE DE DADOS está em baixo: a réplica está
        # bem, e contar esse 503 como falha deixava o nginx sem réplicas «vivas» (502).
        proxy_next_upstream error timeout http_502 http_504;
        proxy_next_upstream_tries 2;

        # Mostra nos cabeçalhos que réplica respondeu (útil na demonstração de falhas).
        add_header X-Servido-Por $upstream_addr always;
    }
}
