# Perdidos & Achados em Docker, com tolerância a falhas.
#
#   browser → nginx (8080) → web (Apache + PHP) → galera1 ⇄ galera2 ⇄ galera3   (MariaDB Galera)
#                                                     ├─ backup → ./backups
#                                                     └─ ia (compara perdidos e achados)
#   autoheal reinicia qualquer contentor que fique «unhealthy».
#
# Galera: os 3 nós têm sempre os mesmos dados (replicação síncrona). Se um cai, os outros dois
# continuam sem parar nem perder nada; quando ele volta, recebe sozinho o que perdeu.
# Quórum: um nó que PARA de forma ordenada sai do cluster e os outros continuam (até 1 nó).
# Se 2 nós CAEM de repente (crash, rede), o que sobra fica sem maioria e recusa escritas até
# outro voltar: assim nunca há dois «clusters» com dados diferentes.
# Se os 3 pararem ao mesmo tempo (docker compose stop, fechar o Docker, desligar o PC), no
# arranque seguinte comparam a última transação de cada um e o mais atualizado refaz o cluster.
# Só se algum nó não voltar é que é preciso: sh docker/galera/recuperar-cluster.sh
#
# Arrancar:   cp .env.example .env   (e mudar as palavras-passe)
#             docker compose up -d --build
# Abrir:      http://localhost:8080
# Ver estado: docker compose ps
# Ver o cluster: docker compose exec galera1 bash -c 'mariadb -uroot -p"$MARIADB_ROOT_PASSWORD" -e "SHOW STATUS LIKE \"wsrep_cluster_size\""'

x-logs: &logs
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-galera: &galera
  image: mariadb:11.4
  restart: unless-stopped
  # Tempo para o MariaDB parar bem e gravar a posição no grastate.dat (o Docker só dá 10 s).
  stop_grace_period: 60s
  # Os scripts correm a partir de uma cópia sem «\r»: no Windows o Git pode convertê-los para
  # CRLF e o bash recusava-os (o nó ficava em «Restarting»).
  entrypoint: ["bash", "-c", "tr -d '\\r' < /galera/arrancar.sh > /tmp/arrancar.sh && exec bash /tmp/arrancar.sh"]
  environment: &galera-env
    MARIADB_DATABASE: ${DB_NAME:-perdidos_achados}
    MARIADB_USER: ${DB_USER:-perdidos}
    MARIADB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD no ficheiro .env}
    MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Define DB_ROOT_PASSWORD no ficheiro .env}
    GALERA_SST_PASSWORD: ${GALERA_SST_PASSWORD:?Define GALERA_SST_PASSWORD no ficheiro .env}
    GALERA_NOS: galera1,galera2,galera3
    GALERA_FUNDADOR: galera1
    TZ: Europe/Lisbon
  healthcheck:
    test: ["CMD", "bash", "-c", "tr -d '\\r' < /galera/saude.sh | bash"]
    interval: 10s
    timeout: 5s
    retries: 3
    start_period: 120s
  # Sem autoheal nos nós Galera: reiniciar um nó que perdeu a maioria não ajuda e apaga o
  # estado (gvwstate.dat) que o Galera usa para se refazer sozinho depois de um crash total.
  # Um crash do processo é tratado pelo restart acima.
  deploy:
    resources:
      limits:
        memory: 768m
  logging: *logs

services:
  # Nó fundador: na instalação nova cria o cluster, as contas e as tabelas (perdidos_achados.sql).
  galera1:
    <<: *galera
    hostname: galera1
    environment:
      <<: *galera-env
      GALERA_NO: galera1
    volumes:
      - dados_galera1:/var/lib/mysql
      - ./docker/galera:/galera:ro
      - estado_galera:/galera-estado
      # Só no PRIMEIRO arranque (volume vazio): tabelas, contas e dados de referência.
      # (A conta do SST, docker/galera/initdb/, é copiada pelo arrancar.sh.)
      - ./backend/database/perdidos_achados.sql:/docker-entrypoint-initdb.d/01-perdidos_achados.sql:ro
    ports:
      # Para abrir a BD com o phpMyAdmin/DBeaver em localhost:3307 (a 3306 é do MAMP).
      - "3307:3306"

  # Os outros nós entram no cluster e recebem do galera1 uma cópia completa (SST).
  galera2:
    <<: *galera
    hostname: galera2
    environment:
      <<: *galera-env
      GALERA_NO: galera2
    volumes:
      - dados_galera2:/var/lib/mysql
      - ./docker/galera:/galera:ro
      - estado_galera:/galera-estado
    ports:
      - "3308:3306"

  galera3:
    <<: *galera
    hostname: galera3
    environment:
      <<: *galera-env
      GALERA_NO: galera3
    volumes:
      - dados_galera3:/var/lib/mysql
      - ./docker/galera:/galera:ro
      - estado_galera:/galera-estado
    ports:
      - "3309:3306"

  # A aplicação. As sessões e as fotos estão na base de dados, por isso para escalar basta
  # acrescentar outro serviço igual e outra linha «server» no nginx.conf.
  web:
    build: ./docker/web
    image: perdidos-achados-web
    hostname: web
    restart: unless-stopped
    environment:
      # O PHP usa o primeiro nó sincronizado desta lista (backend/config/database.php).
      DB_HOST: galera1,galera2,galera3
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-perdidos_achados}
      DB_USER: ${DB_USER:-perdidos}
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD no ficheiro .env}
    volumes:
      - ./frontend:/var/www/frontend:ro
      - ./backend:/var/www/backend:ro
    depends_on:
      - galera1
    labels:
      autoheal: "true"
    deploy:
      resources:
        limits:
          memory: 256m
    logging: *logs

  # A IA (pasta ia/): compara cada objeto perdido com os achados na receção e grava as
  # sugestões. Só fala com a base de dados; o modelo vem dentro da imagem (sem internet).
  # Só pode haver UM trabalhador de IA: com este serviço ligado, não lancem outro à mão.
  # Ver o que está a fazer:  docker compose logs -f ia
  # Depois de mudar ficheiros em ia/:  docker compose up -d --build ia
  ia:
    build: ./ia
    image: perdidos-achados-ia
    restart: unless-stopped
    # Um «init» à frente do Python: sem ele o Python ignora o pedido para parar e o Docker
    # espera 10 s até o matar. O pedido que estava a meio volta à fila no arranque seguinte.
    init: true
    environment:
      # Tenta os nós por esta ordem; se um estiver em baixo, passa ao seguinte.
      DB_HOST: galera1,galera2,galera3
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-perdidos_achados}
      DB_USER: ${DB_USER:-perdidos}
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD no ficheiro .env}
    depends_on:
      - galera1
    deploy:
      resources:
        limits:
          memory: 1g
    logging: *logs

  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      # Só neste computador (127.0.0.1): o painel de testes pode parar contentores, por isso
      # o site não fica acessível a outras máquinas da rede.
      - "127.0.0.1:8080:80"
    volumes:
      # A pasta inteira (e não só o ficheiro): editar o nginx.conf não quebra a montagem.
      - ./docker/nginx:/etc/nginx/conf.d:ro
    depends_on:
      - web
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 15s
      timeout: 5s
      retries: 3
    labels:
      autoheal: "true"
    deploy:
      resources:
        limits:
          memory: 64m
    logging: *logs

  # Backups de hora a hora a partir de um nó que não é o que recebe as escritas (galera3,
  # ou o seguinte disponível): todos têm os mesmos dados.
  backup:
    image: mariadb:11.4
    restart: unless-stopped
    entrypoint: ["sh", "-c", "tr -d '\\r' < /scripts/backup.sh > /tmp/backup.sh && exec sh /tmp/backup.sh"]
    environment:
      DB_HOST: galera3,galera2,galera1
      DB_NAME: ${DB_NAME:-perdidos_achados}
      DB_USER: ${DB_USER:-perdidos}
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD no ficheiro .env}
      BACKUP_INTERVALO: ${BACKUP_INTERVALO:-3600}
      BACKUP_MANTER: ${BACKUP_MANTER:-24}
      TZ: Europe/Lisbon
    volumes:
      - ./docker/backup:/scripts:ro
      - ./backups:/backups
    depends_on:
      - galera1
    deploy:
      resources:
        limits:
          memory: 128m
    logging: *logs

  # Para o laboratório da API (testar-api.html → vista Docker): mostra o estado dos contentores
  # e permite parar / arrancar / provocar um crash nos nós Galera, no web e no backup.
  # Só desenvolvimento: tem acesso ao Docker, mas só aceita essas ações nesses serviços.
  controlo:
    image: python:3.12-alpine
    restart: unless-stopped
    command: ["python", "-u", "/app/servidor.py"]
    environment:
      CONTROLO_SERVICOS: galera1,galera2,galera3,web,backup
      # Árbitro: se os nós ligados ficarem sem maioria e o Docker confirmar que os outros estão
      # parados, reativa o cluster no que sobrou ao fim deste tempo (segundos).
      ARBITRO_NOS: galera1,galera2,galera3
      ARBITRO_ESPERA: 15
    volumes:
      - ./docker/controlo:/app:ro
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/estado', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 64m
    logging: *logs

  # O Docker só reinicia sozinho um contentor que TERMINA. O autoheal trata dos que ficam
  # de pé mas «unhealthy» (ex.: um nó Galera que perdeu a sincronização).
  autoheal:
    image: willfarrell/autoheal:1.2.0
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: 10
      AUTOHEAL_START_PERIOD: 180
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    deploy:
      resources:
        limits:
          memory: 32m
    logging: *logs

volumes:
  dados_galera1:
  dados_galera2:
  dados_galera3:
  # Partilhado pelos 3 nós: cada um deixa aqui a sua última transação para decidirem, sem
  # ajuda, quem refunda o cluster depois de pararem todos (docker/galera/arrancar.sh).
  estado_galera:
