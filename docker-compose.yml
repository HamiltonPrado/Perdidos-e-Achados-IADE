# Perdidos & Achados em Docker: nginx → web (PHP) → MariaDB Galera (3 nós), mais backup, ia, controlo e autoheal.
# Arrancar: cp .env.example .env  e  docker compose up -d --build   ·   Abrir: http://localhost:8080
# Se o cluster não voltar sozinho: sh docker/galera/recuperar-cluster.sh

x-logs: &logs
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-galera: &galera
  image: mariadb:11.4
  restart: unless-stopped
  # Tempo para o MariaDB parar bem e gravar a posição no grastate.dat (o Docker só dá 10 s).
  stop_grace_period: 60s
  # Corre uma cópia do script sem «\r» (CRLF do Windows).
  entrypoint: ["bash", "-c", "tr -d '\\r' < /galera/arrancar.sh > /tmp/arrancar.sh && exec bash /tmp/arrancar.sh"]
  environment: &galera-env
    MARIADB_DATABASE: ${DB_NAME:-perdidos_achados}
    MARIADB_USER: ${DB_USER:-perdidos}
    MARIADB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD no ficheiro .env}
    MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Define DB_ROOT_PASSWORD no ficheiro .env}
    GALERA_SST_PASSWORD: ${GALERA_SST_PASSWORD:?Define GALERA_SST_PASSWORD no ficheiro .env}
    GALERA_NOS: galera1,galera2,galera3
    GALERA_FUNDADOR: galera1
    TZ: Europe/Lisbon
  healthcheck:
    test: ["CMD", "bash", "-c", "tr -d '\\r' < /galera/saude.sh | bash"]
    interval: 10s
    timeout: 5s
    retries: 3
    start_period: 120s
  # Sem autoheal: reiniciar um nó sem maioria apaga o estado que o Galera usa para se refazer.
  deploy:
    resources:
      limits:
        memory: 768m
  logging: *logs

services:
  # Nó fundador: na instalação nova cria o cluster, as contas e as tabelas (perdidos_achados.sql).
  galera1:
    <<: *galera
    hostname: galera1
    environment:
      <<: *galera-env
      GALERA_NO: galera1
    volumes:
      - dados_galera1:/var/lib/mysql
      - ./docker/galera:/galera:ro
      - estado_galera:/galera-estado
      # Só no primeiro arranque (volume vazio): tabelas, contas e dados de referência.
      - ./backend/database/perdidos_achados.sql:/docker-entrypoint-initdb.d/01-perdidos_achados.sql:ro
    ports:
      # Para abrir a BD com o phpMyAdmin/DBeaver em localhost:3307 (a 3306 é do MAMP).
      - "3307:3306"

  # Os outros nós entram no cluster e recebem do galera1 uma cópia completa (SST).
  galera2:
    <<: *galera
    hostname: galera2
    environment:
      <<: *galera-env
      GALERA_NO: galera2
    volumes:
      - dados_galera2:/var/lib/mysql
      - ./docker/galera:/galera:ro
      - estado_galera:/galera-estado
    ports:
      - "3308:3306"

  galera3:
    <<: *galera
    hostname: galera3
    environment:
      <<: *galera-env
      GALERA_NO: galera3
    volumes:
      - dados_galera3:/var/lib/mysql
      - ./docker/galera:/galera:ro
      - estado_galera:/galera-estado
    ports:
      - "3309:3306"

  # A aplicação (PHP). Sessões e fotos estão na base de dados, por isso pode ter várias réplicas.
  web:
    build: ./docker/web
    image: perdidos-achados-web
    hostname: web
    restart: unless-stopped
    environment:
      # O PHP usa o primeiro nó sincronizado desta lista (backend/config/database.php).
      DB_HOST: galera1,galera2,galera3
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-perdidos_achados}
      DB_USER: ${DB_USER:-perdidos}
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD no ficheiro .env}
    volumes:
      - ./frontend:/var/www/frontend:ro
      - ./backend:/var/www/backend:ro
    depends_on:
      - galera1
    labels:
      autoheal: "true"
    deploy:
      resources:
        limits:
          memory: 256m
    logging: *logs

  # A IA: compara perdidos e achados e grava as sugestões (logs: docker compose logs -f ia).
  # Depois de mudar ia/: docker compose up -d --build ia
  ia:
    build: ./ia
    image: perdidos-achados-ia
    restart: unless-stopped
    # «init»: faz o Python parar logo com docker compose stop.
    init: true
    environment:
      # Tenta os nós por esta ordem; se um estiver em baixo, passa ao seguinte.
      DB_HOST: galera1,galera2,galera3
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-perdidos_achados}
      DB_USER: ${DB_USER:-perdidos}
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD no ficheiro .env}
    depends_on:
      - galera1
    deploy:
      resources:
        limits:
          memory: 1g
    logging: *logs

  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      # Só neste computador: o painel de testes pode parar contentores.
      - "127.0.0.1:8080:80"
    volumes:
      # A pasta inteira (e não só o ficheiro): editar o nginx.conf não quebra a montagem.
      - ./docker/nginx:/etc/nginx/conf.d:ro
    depends_on:
      - web
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 15s
      timeout: 5s
      retries: 3
    labels:
      autoheal: "true"
    deploy:
      resources:
        limits:
          memory: 64m
    logging: *logs

  # Backups de hora a hora (lê do galera3 ou do seguinte disponível).
  backup:
    image: mariadb:11.4
    restart: unless-stopped
    entrypoint: ["sh", "-c", "tr -d '\\r' < /scripts/backup.sh > /tmp/backup.sh && exec sh /tmp/backup.sh"]
    environment:
      DB_HOST: galera3,galera2,galera1
      DB_NAME: ${DB_NAME:-perdidos_achados}
      DB_USER: ${DB_USER:-perdidos}
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD no ficheiro .env}
      BACKUP_INTERVALO: ${BACKUP_INTERVALO:-3600}
      BACKUP_MANTER: ${BACKUP_MANTER:-24}
      TZ: Europe/Lisbon
    volumes:
      - ./docker/backup:/scripts:ro
      - ./backups:/backups
    depends_on:
      - galera1
    deploy:
      resources:
        limits:
          memory: 128m
    logging: *logs

  # Painel do testar-api.html (ver, parar e arrancar contentores) e árbitro do Galera. Só desenvolvimento.
  controlo:
    image: python:3.12-alpine
    restart: unless-stopped
    command: ["python", "-u", "/app/servidor.py"]
    environment:
      CONTROLO_SERVICOS: galera1,galera2,galera3,web,backup
      # Árbitro: reativa o cluster no nó que sobrou se os outros estiverem parados há este tempo (s).
      ARBITRO_NOS: galera1,galera2,galera3
      ARBITRO_ESPERA: 15
    volumes:
      - ./docker/controlo:/app:ro
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/estado', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 64m
    logging: *logs

  # Reinicia contentores que ficam «unhealthy» (o Docker só reinicia os que terminam).
  autoheal:
    image: willfarrell/autoheal:1.2.0
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: 10
      AUTOHEAL_START_PERIOD: 180
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    deploy:
      resources:
        limits:
          memory: 32m
    logging: *logs

volumes:
  dados_galera1:
  dados_galera2:
  dados_galera3:
  # Partilhado pelos 3 nós Galera: votação de quem refunda o cluster (arrancar.sh).
  estado_galera:
