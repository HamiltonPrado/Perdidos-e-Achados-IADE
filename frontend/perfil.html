<!doctype html>
<!--
  perfil.html — PERFIL (nome e foto)   🔒 precisa de sessão
  JavaScript: js/pages/perfil.js · Estilos: assets/css/pages/perfil.css
-->
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil · Achados e Perdidos IADE</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Public+Sans:wght@400;500;600&display=swap">

  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/components/navbar.css">
  <link rel="stylesheet" href="assets/css/components/footer.css">
  <link rel="stylesheet" href="assets/css/pages/perfil.css">
</head>
<body>
  <header class="navbar" id="navbar"></header>

  <main class="contentor contentor--estreito pagina">
    <p class="sobretitulo">A tua conta</p>
    <h1 class="titulo-pagina">Perfil</h1>
    <p class="intro">O teu nome e a tua foto aparecem nos anúncios que publicas e nos pedidos que fazes.</p>

    <form class="formulario perfil" id="form-perfil" novalidate>
      <!-- Foto -->
      <div class="perfil__foto">
        <div class="perfil__avatar" id="avatar" role="img" aria-label="Foto de perfil"></div>
        <div class="perfil__botoes">
          <!-- A label funciona como botão: ao clicar abre a escolha de ficheiro -->
          <label for="ficheiro-foto" class="botao botao--preto botao--pequeno">Alterar foto</label>
          <input id="ficheiro-foto" type="file" accept="image/*" class="so-leitor">
          <button type="button" class="botao botao--contorno botao--pequeno" id="remover-foto">Remover foto</button>
          <span class="ajuda">JPG ou PNG · uma foto quadrada fica melhor</span>
        </div>
      </div>

      <!-- Nome -->
      <div class="grupo">
        <label for="nome" class="rotulo">Nome</label>
        <input id="nome" type="text" class="campo" maxlength="60" autocomplete="name">
        <span class="ajuda">Nos anúncios aparece só o primeiro nome e a inicial do apelido, por exemplo: <strong id="exemplo-nome"></strong></span>
        <span class="erro" id="erro-nome" hidden>Escreve o teu nome.</span>
      </div>

      <div class="acoes">
        <span class="mensagem" id="guardado" role="status" hidden>Perfil guardado.</span>
        <button type="submit" class="botao botao--destaque" id="botao-guardar">Guardar alterações</button>
      </div>
    </form>
  </main>

  <footer class="footer" id="footer"></footer>

  <script type="module" src="js/pages/perfil.js"></script>
</body>
</html>
