<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perdidos &amp; Achados</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=DM+Sans:wght@400;500;700&display=swap">

  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/components/navbar.css">
  <link rel="stylesheet" href="assets/css/components/footer.css">
  <link rel="stylesheet" href="assets/css/components/item-card.css">
  <link rel="stylesheet" href="assets/css/components/filtro-categorias.css">
  <link rel="stylesheet" href="assets/css/pages/home.css">
</head>
<body>
  <header class="navbar" id="navbar"></header>

  <main>
    <section class="destaque">
      <div class="contentor destaque__conteudo">
        <h1 class="destaque__titulo">Perdeste alguma coisa?</h1>
        <p class="destaque__texto">Procura entre os objetos encontrados pelo IADE.</p>

        <form class="pesquisa" role="search" id="form-pesquisa">
          <label for="pesquisa" class="so-leitor">Pesquisar objetos</label>
          <div class="pesquisa__caixa">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
            <input id="pesquisa" type="search" placeholder="Ex.: carteira, chaves, auscultadores…">
          </div>
          <button type="submit" class="botao botao--preto">Pesquisar</button>
          <a href="publicar.html" class="botao botao--destaque">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
            Encontrei um objeto
          </a>
        </form>
      </div>
    </section>

    <div class="contentor lista">
      <div id="filtro-categorias"></div>

      <div class="lista__barra">
        <p class="lista__contagem" id="contagem" aria-live="polite">A carregar…</p>
        <div class="lista__selects">
          <label for="filtro-local" class="so-leitor">Local</label>
          <select id="filtro-local" class="lista__select">
            <option value="">Todo o campus</option>
          </select>
          <label for="filtro-ordem" class="so-leitor">Ordenar</label>
          <select id="filtro-ordem" class="lista__select">
            <option value="recentes">Mais recentes</option>
            <option value="antigos">Mais antigos</option>
          </select>
        </div>
      </div>

      <div class="vazio" id="lista-vazia" hidden>
        <p>Nenhum objeto encontrado com estes filtros.</p>
        <button type="button" class="botao botao--preto botao--pequeno" id="limpar-filtros">Limpar filtros</button>
      </div>

      <div class="grelha" id="grelha"></div>
    </div>
  </main>

  <footer class="footer" id="footer"></footer>

  <script type="module" src="js/pages/home.js"></script>
</body>
</html>
