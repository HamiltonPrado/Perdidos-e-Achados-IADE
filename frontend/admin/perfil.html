<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil · Receção · Perdidos &amp; Achados</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=DM+Sans:wght@400;500;700&display=swap">

  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/components/admin-header.css">
  <link rel="stylesheet" href="../assets/css/components/footer.css">
  <link rel="stylesheet" href="../assets/css/pages/perfil.css">
</head>
<body>
  <header class="admin-header" id="admin-header"></header>

  <main class="contentor contentor--estreito pagina">
    <p class="sobretitulo">Área da receção</p>
    <h1 class="titulo-pagina">Perfil</h1>
    <p class="intro">O teu nome e a tua foto identificam-te na área da receção.</p>

    <form class="formulario perfil" id="form-perfil" novalidate>
      <div class="perfil__foto">
        <div class="perfil__avatar" id="avatar" role="img" aria-label="Foto de perfil"></div>
        <div class="perfil__botoes">
          <label for="ficheiro-foto" class="botao botao--preto botao--pequeno">Alterar foto</label>
          <input id="ficheiro-foto" type="file" accept="image/*" class="so-leitor">
          <button type="button" class="botao botao--contorno botao--pequeno" id="remover-foto">Remover foto</button>
          <span class="ajuda">JPG ou PNG · uma foto quadrada fica melhor</span>
        </div>
      </div>

      <div class="grupo">
        <label for="nome" class="rotulo">Nome</label>
        <input id="nome" type="text" class="campo" maxlength="60" autocomplete="name">
        <span class="erro" id="erro-nome" hidden>Escreve o teu nome.</span>
      </div>

      <div class="grupo">
        <span class="rotulo">Email</span>
        <span id="email"></span>
      </div>

      <div class="acoes">
        <span class="mensagem" id="guardado" role="status" hidden>Perfil guardado.</span>
        <button type="submit" class="botao botao--destaque" id="botao-guardar">Guardar alterações</button>
      </div>
    </form>

    <section class="perfil__sessao">
      <div>
        <h2 class="perfil__sessao-titulo">Sessão</h2>
        <p class="ajuda">Sais da área da receção neste dispositivo.</p>
      </div>
      <button type="button" class="botao botao--contorno" id="terminar-sessao">Terminar sessão</button>
    </section>
  </main>

  <footer class="footer" id="footer"></footer>

  <script type="module" src="../js/pages/adminPerfil.js"></script>
</body>
</html>
